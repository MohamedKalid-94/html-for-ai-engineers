<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module 08 - Forms</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 700px; }
    h2 { border-bottom: 2px solid #bdc3c7; padding-bottom: 4px; margin-top: 40px; }
    form { background: #f4f6f8; padding: 16px; border-radius: 8px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input[type="text"], input[type="email"], input[type="password"],
    input[type="number"], input[type="url"], input[type="date"],
    select, textarea { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
    fieldset { margin-top: 16px; }
    button, input[type="submit"], input[type="reset"] { margin-top: 16px; padding: 8px 16px; cursor: pointer; }
    input:invalid { border: 2px solid #e74c3c; }
    input:valid   { border: 2px solid #27ae60; }
  </style>
</head>
<body>

  <h1>Forms</h1>

  <!-- ========== 1. BASIC FORM + FORM ATTRIBUTES ========== -->
  <h2>1. Basic Form</h2>
  <!--
    action = where the data is sent
    method = how it is sent (get = in the URL, post = in the request body)
  -->
  <form action="#" method="get" autocomplete="on">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" placeholder="Enter your username">

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="you@example.com">

    <button type="submit">Submit</button>
  </form>
  <p><small>After submitting, look at the browser address bar: the data appears as ?username=...&amp;email=...</small></p>

  <!-- ========== 2. INPUT TYPES ========== -->
  <h2>2. Input Types</h2>
  <form action="#" method="get">

    <label for="pw">Password</label>
    <input type="password" id="pw" name="password">

    <label for="age">Age (number)</label>
    <input type="number" id="age" name="age" min="1" max="120" step="1">

    <label for="site">Website (url)</label>
    <input type="url" id="site" name="site" placeholder="https://example.com">

    <label for="dob">Date of birth</label>
    <input type="date" id="dob" name="dob">

    <label for="color">Favorite color</label>
    <input type="color" id="color" name="color" value="#3498db">

    <label for="temp">Temperature (range): <output id="tempOut">0.7</output></label>
    <input type="range" id="temp" name="temperature" min="0" max="2" step="0.1" value="0.7"
           oninput="document.getElementById('tempOut').value = this.value">

    <label for="doc">Upload a file</label>
    <input type="file" id="doc" name="document" accept=".pdf,.txt,.md">

    <input type="hidden" name="form_version" value="1">

    <button type="submit">Submit</button>
  </form>

  <!-- ========== 3. RADIO, CHECKBOX, SELECT, TEXTAREA ========== -->
  <h2>3. Choices and Text Areas</h2>
  <form action="#" method="get">

    <fieldset>
      <legend>Experience level (radio: pick one)</legend>
      <label><input type="radio" name="level" value="beginner" checked> Beginner</label>
      <label><input type="radio" name="level" value="intermediate"> Intermediate</label>
      <label><input type="radio" name="level" value="advanced"> Advanced</label>
    </fieldset>

    <fieldset>
      <legend>Interests (checkbox: pick many)</legend>
      <label><input type="checkbox" name="interests" value="rag" checked> RAG</label>
      <label><input type="checkbox" name="interests" value="agents"> Agents</label>
      <label><input type="checkbox" name="interests" value="finetuning"> Fine-tuning</label>
    </fieldset>

    <label for="model">Model (dropdown)</label>
    <select id="model" name="model">
      <option value="">-- Choose a model --</option>
      <optgroup label="Open source">
        <option value="model-a">Model A</option>
        <option value="model-b" selected>Model B</option>
      </optgroup>
      <optgroup label="Hosted">
        <option value="model-c">Model C</option>
      </optgroup>
    </select>

    <label for="tools">Search with suggestions (datalist)</label>
    <input list="toolList" id="tools" name="tool" placeholder="Start typing...">
    <datalist id="toolList">
      <option value="LangChain">
      <option value="LangGraph">
      <option value="LlamaIndex">
    </datalist>

    <label for="prompt">Your prompt (textarea)</label>
    <textarea id="prompt" name="prompt" rows="4" maxlength="300"
              placeholder="Ask something..."></textarea>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
  </form>

  <!-- ========== 4. INPUT ATTRIBUTES AND VALIDATION ========== -->
  <h2>4. Input Attributes and Validation</h2>
  <form action="#" method="get">

    <label for="v-name">Name (required, 3 to 20 characters)</label>
    <input type="text" id="v-name" name="name" required minlength="3" maxlength="20">

    <label for="v-mail">Email (required)</label>
    <input type="email" id="v-mail" name="email" required>

    <label for="v-code">Code (pattern: 3 capital letters + 2 digits, for example ABC12)</label>
    <input type="text" id="v-code" name="code" pattern="[A-Z]{3}[0-9]{2}"
           title="Three capital letters followed by two digits" required>

    <label for="v-ro">Read-only field</label>
    <input type="text" id="v-ro" value="Cannot edit me" readonly>

    <label for="v-dis">Disabled field (not submitted)</label>
    <input type="text" id="v-dis" value="Disabled" disabled>

    <label for="v-focus">Autofocus example</label>
    <input type="text" id="v-focus" name="focus" autofocus>

    <button type="submit">Validate and submit</button>
  </form>

  <!-- ========== 5. AI CHAT FORM ========== -->
  <h2>5. Mini Chat Prompt Form</h2>
  <form action="#" method="get">
    <label for="chat-input">Message</label>
    <textarea id="chat-input" name="message" rows="3" required
              placeholder="Type your message..."></textarea>

    <label for="chat-model">Model</label>
    <select id="chat-model" name="model">
      <option value="model-a">Model A</option>
      <option value="model-b">Model B</option>
    </select>

    <label for="chat-temp">Temperature</label>
    <input type="number" id="chat-temp" name="temperature" min="0" max="2" step="0.1" value="0.7">

    <label><input type="checkbox" name="stream" checked> Stream response</label>

    <button type="submit">Send</button>
  </form>

</body>
</html>
