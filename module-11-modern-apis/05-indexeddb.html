<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndexedDB API</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p><a href="index.html">&larr; Module 11</a></p>
  <h1>IndexedDB</h1>
  <p class="note">A real database inside the browser: large amounts of structured data, asynchronous, with indexes and transactions. Open DevTools &gt; Application &gt; IndexedDB to see it.</p>

  <form id="note-form">
    <input type="text" id="note-text" placeholder="Write a note" required>
    <button type="submit">Save note</button>
  </form>
  <ul id="notes"></ul>

  <script>
    const DB_NAME = "notes-db";
    const STORE = "notes";

    // Open (or create) the database
    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = () => {          // runs only on creation or version change
          request.result.createObjectStore(STORE, { keyPath: "id", autoIncrement: true });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function addNote(text) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).add({ text, created: Date.now() });
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getNotes() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const request = db.transaction(STORE, "readonly").objectStore(STORE).getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function deleteNote(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).delete(id);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    async function render() {
      const list = document.getElementById("notes");
      list.innerHTML = "";
      for (const note of await getNotes()) {
        const li = document.createElement("li");
        li.textContent = `${note.text} (${new Date(note.created).toLocaleTimeString()}) `;
        const del = document.createElement("button");
        del.textContent = "Delete";
        del.addEventListener("click", async () => { await deleteNote(note.id); render(); });
        li.appendChild(del);
        list.appendChild(li);
      }
    }

    document.getElementById("note-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = document.getElementById("note-text");
      await addNote(input.value.trim());
      input.value = "";
      render();
    });

    render();
  </script>
</body>
</html>
